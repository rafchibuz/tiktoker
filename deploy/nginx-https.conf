server {
    listen 80;
    listen [::]:80;
    server_name tiktok.ravshan.tv;
    root /var/www/tiktoker-public;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tiktok.ravshan.tv;
    ssl_certificate /etc/letsencrypt/live/tiktok.ravshan.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiktok.ravshan.tv/privkey.pem;
    root /var/www/tiktoker-public;
    index index.html;
    client_max_body_size 600m;

    location = /terms { try_files /terms.html =404; }
    location = /privacy { try_files /privacy.html =404; }
    location ~ "^/tiktok/media/[a-f0-9]{24}/[0-9]{10,13}/[a-f0-9]{64}$" {
        proxy_pass http://127.0.0.1:4317;
        proxy_set_header Host 127.0.0.1:4317;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }
    location = /tiktok/callback {
        proxy_pass http://127.0.0.1:4317;
        proxy_set_header Host 127.0.0.1:4317;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/(studio|montage|editor|analysis|tiktok/connect|tiktok/settings|tiktok-settings\.js|app\.js|editor\.js|analysis\.js|composition\.js|style\.css|fonts/|api/) {
        auth_basic "Tiktoker studio";
        auth_basic_user_file /etc/nginx/tiktoker.htpasswd;
        proxy_pass http://127.0.0.1:4317;
        proxy_set_header Host 127.0.0.1:4317;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }
    location / { try_files $uri $uri/ =404; }
}
