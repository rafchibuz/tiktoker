<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Анализ эфира · ТикТокер</title><link rel="stylesheet" href="/style.css"></head>
<body><aside class="sidebar"><a class="brand" href="/studio">т<span>и</span>ктокер<span class="brand-dot">.</span></a><div class="workspace">ЛОКАЛЬНАЯ СТУДИЯ</div><nav><a href="/studio">◉ <span>Новые клипы</span></a><a href="/analysis" class="nav-active">◷ <span>Анализ эфира</span></a><a href="/montage">▣ <span>Монтаж и проверка</span></a><a href="/tiktok/settings">↗ <span>TikTok</span></a></nav><div class="sidebar-bottom"><span class="tag">АЛЬФА · 0.1</span><p>Клипы эфира отсортированы по просмотрам Twitch.</p></div></aside>
<main><header><div><p class="eyebrow">ПОИСК МОМЕНТОВ</p><h1>Анализ эфира<span>.</span></h1><p class="muted">Вставь ссылку на запись Twitch. Ссылка на канал найдёт текущий эфир или последнюю запись.</p></div></header>
<form id="analysis-form" class="analysis-form"><label for="stream-url">Ссылка на эфир</label><div class="analysis-input-row"><input id="stream-url" type="url" required placeholder="https://www.twitch.tv/videos/1234567890" autocomplete="off"><button id="analyze" class="primary" type="submit">Найти клипы</button></div></form>
<div id="analysis-error" class="notice" role="alert" hidden></div><div id="analysis-status" class="success" role="status" hidden></div>
<section id="analysis-result" hidden><div class="analysis-heading"><div><h2 id="stream-title"></h2><p class="muted" id="stream-meta"></p></div><a id="stream-link" target="_blank" rel="noopener noreferrer" class="link-button">Открыть эфир ↗</a></div><div class="analysis-filters"><label for="min-views">Минимум просмотров</label><input id="min-views" type="number" min="0" step="1" value="10"><span id="analysis-count" class="muted"></span></div><p id="analysis-warning" class="notice" hidden></p><div id="analysis-groups" class="analysis-groups"></div></section>
</main><script type="module" src="/analysis.js"></script></body></html>
